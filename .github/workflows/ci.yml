name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # prisma generate требует, чтобы DATABASE_URL был синтаксически валиден —
      # реальное подключение к БД для generate/тайпчека/юнит-тестов не нужно.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
      BOT_TOKEN: "test-token"
      ADMIN_TELEGRAM_IDS: "1"
      PUBLIC_URL: "https://example.com"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test
